<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bracketGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0F172A" />
  
  <!-- Terminal brackets < > -->
  <path d="M45 60 L25 100 L45 140" 
        fill="none" 
        stroke="url(#bracketGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <path d="M155 60 L175 100 L155 140" 
        fill="none" 
        stroke="url(#bracketGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- JS Text -->
  <text x="100" y="115" 
        font-family="'Fira Code', 'JetBrains Mono', monospace" 
        font-size="52" 
        font-weight="700" 
        fill="url(#codeGradient)" 
        text-anchor="middle">
    JS
  </text>
  
  <!-- Code dots decoration -->
  <circle cx="70" cy="155" r="4" fill="#3B82F6" opacity="0.6"/>
  <circle cx="85" cy="155" r="4" fill="#10B981" opacity="0.6"/>
  <circle cx="100" cy="155" r="4" fill="#F59E0B" opacity="0.6"/>
  <circle cx="115" cy="155" r="4" fill="#EC4899" opacity="0.6"/>
  <circle cx="130" cy="155" r="4" fill="#8B5CF6" opacity="0.6"/>
</svg>